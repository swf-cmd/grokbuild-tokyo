name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  electron_config_cache: ${{ github.workspace }}/work/electron-cache

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.electron_config_cache }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:all
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Test the Windows portable ZIP after extraction
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $archive = "dist/Grokbuild-Tokyo-$version-win-x64.zip"
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Windows ZIP checksum mismatch' }
          Move-Item App work/windows-build-before-extraction
          Expand-Archive -LiteralPath $archive -DestinationPath .
      - run: npm run test:packaged
      - name: Keep tested Windows portable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64-tested
          path: |
            dist/*-win-x64.zip
            dist/*-win-x64.zip.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Keep UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-ui-diagnostics
          path: |
            work/images-accounts-qa/run-*/*.png
            work/images-accounts-qa/run-*/results.json
            work/images-accounts-qa/run-*/diagnostics.json
            work/ui-controls/run-*/failure-*.png
            work/i18n-qa/run-*/*.png
            work/i18n-qa/run-*/results.json
            work/ui-attachments/run-*/*.png
            work/onboarding-qa/run-*/*.png
            work/onboarding-qa/run-*/results.json
            work/model-refresh-qa/run-*/*.png
          retention-days: 7
          if-no-files-found: ignore

  macos-release-archive:
    name: Mac release ZIP (Intel runtime)
    needs: macos
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.electron_config_cache }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Publish the arm64 job's ZIP only after this same archive has also run
      # natively on Intel. Rebuilding a second ZIP is not equivalent coverage.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-universal-tested-on-arm64
          path: dist
      - name: Verify and extract the release ZIP
        run: |
          (cd dist && shasum -a 256 -c ./*-mac-universal.zip.sha256)
          mkdir App
          ditto -x -k dist/*-mac-universal.zip App
          # Electron 44 downloads its development runtime lazily. This job
          # launches only the extracted app, so initialize the reference first.
          node node_modules/electron/install.js
          # The verifier compares notices embedded in the distributed bundle
          # against this exact Electron version's original runtime notices.
          cp node_modules/electron/dist/LICENSE App/LICENSE
          cp node_modules/electron/dist/LICENSES.chromium.html App/LICENSES.chromium.html
      - run: npm run test:packaged -- --platform darwin --arch universal

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.electron_config_cache }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:all
      - run: npm audit --audit-level=moderate
      # Build one universal release on Apple Silicon. The archive job runs that
      # exact ZIP on Intel; the x64 matrix entry only validates source behavior.
      - if: matrix.arch == 'arm64'
        run: npm run build:mac
      - if: matrix.arch == 'arm64'
        run: npm run test:packaged -- --platform darwin --arch universal
      - name: Keep tested universal Mac ZIP
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-universal-tested-on-${{ matrix.arch }}
          path: |
            dist/*-mac-universal.zip
            dist/*-mac-universal.zip.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Keep UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-${{ matrix.arch }}-ui-diagnostics
          path: |
            work/images-accounts-qa/run-*/*.png
            work/images-accounts-qa/run-*/results.json
            work/images-accounts-qa/run-*/diagnostics.json
            work/ui-controls/run-*/failure-*.png
            work/i18n-qa/run-*/*.png
            work/i18n-qa/run-*/results.json
            work/ui-attachments/run-*/*.png
            work/onboarding-qa/run-*/*.png
            work/onboarding-qa/run-*/results.json
            work/model-refresh-qa/run-*/*.png
          retention-days: 7
          if-no-files-found: ignore
