name: README screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/capture-readme.cjs
      - name: Keep screenshots and rain verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-screenshots
          path: |
            work/readme-capture/images/*.png
            work/readme-capture/qa/*.png
            work/readme-capture/qa/results.json
          retention-days: 14
          if-no-files-found: error
