name: README screenshots

on:
  workflow_dispatch:
  # TEMPORARY for docs/readme-refresh: capture on push and commit the results
  # back to the branch for review. Removed before the branch is merged.
  push:
    branches: [docs/readme-refresh]

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install GIF encoder
        run: choco install ffmpeg --yes --no-progress --limit-output
      - run: node scripts/capture-readme.cjs --motion
      - name: Keep screenshots and rain verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-screenshots
          path: |
            work/readme-capture/images/*.png
            work/readme-capture/images/*.gif
            work/readme-capture/qa/*.png
            work/readme-capture/qa/results.json
          retention-days: 14
          if-no-files-found: error
      - name: Commit captures to the branch for review (temporary)
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p review
          cp work/readme-capture/images/*.png work/readme-capture/images/*.gif review/ 2>/dev/null || true
          cp work/readme-capture/qa/results.json review/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f review
          git commit -m "Capture README images for review (${{ job.status }})" || exit 0
          git push origin HEAD:${{ github.ref_name }}
